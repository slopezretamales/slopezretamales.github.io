# Configuración Básica
locale                   : "es-CL"
title                    : "Sebastián López Retamales"
name                     : "Sebastián López Retamales"
description              : "Doctor en Ingeniería Geotécnica - Portafolio Académico"
url                      : "https://slopezretamales.github.io"
baseurl                  : ""
repository               : "slopezretamales/slopezretamales.github.io"

# Tema Minima Remoto
remote_theme             : "jekyll/minima@v2.5.1"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Páginas visibles en el Menú Superior
header_pages:
  - about.md

# Enlaces a Redes y Perfiles Académicos (Soportados por Minima)
github_username          : slopezretamales
orcid_username           : "0000-0000-0000-0000" # Reemplaza con tu ID de ORCID
minima:
  social_links:
    - { platform: github,        user_url: "https://github.com/slopezretamales" }
    - { platform: google_scholar, user_url: "https://scholar.google.com/citations?user=PS_CX0AAAAAJ" }

# Procesamiento
encoding                 : "utf-8"
markdown                 : kramdown
highlighter              : rouge

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
