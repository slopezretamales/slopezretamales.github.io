# Configuración Básica
locale                   : "es-CL"
title                    : "Sebastián López Retamales"
description              : "Doctor en Ingeniería Geotécnica - Portafolio y Documentación Académica"
url                      : "https://slopezretamales.github.io"
baseurl                  : ""
repository               : "slopezretamales/slopezretamales.github.io"

# Configuración del Tema Just the Docs
remote_theme             : "just-the-docs/just-the-docs"

# Búsqueda integrada (funciona automáticamente)
search_enabled           : true
search                   :
  heading_level          : 3
  previews               : 2

# Ajustes de Navegación Lateral
nav_enabled              : true
heading_anchors          : true

# Color / Esquema (opciones: "light", "dark")
color_scheme             : "light"

# Auxiliares y Redes
aux_links:
  "GitHub": "https://github.com/slopezretamales"
  "Google Scholar": "https://scholar.google.com/citations?user=PS_CX0AAAAAJ"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Procesamiento
encoding                 : "utf-8"
markdown                 : kramdown
highlighter              : rouge

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
